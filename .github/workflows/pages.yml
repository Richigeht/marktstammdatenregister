name: Validate Pages Source

on:
  pull_request:
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".prettierrc.json"
      - ".nvmrc"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".prettierrc.json"
      - ".nvmrc"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --python 3.12

      - name: Check frontend formatting
        run: npm run format:check

      - name: Test frontend data behavior
        run: npm test

      - name: Test export serialization
        run: uv run python -m unittest discover -s tests -v

      - name: Build static shell
        run: uv run build-static-site

      - name: Install browser for interaction tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile interactions
        run: npm run test:browser

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-shell-preview
          path: dist
